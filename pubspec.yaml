name: pigcode_ai_workspace
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/provider
  - packages/ai
  - packages/provider_utils
  - packages/openai
  - packages/openai_compatible
  - packages/anthropic
  - packages/protocol_utils
  - packages/acp
  - packages/mcp
  - packages/agent_kernel
  - packages/agent_io
  - packages/lsp
  - packages/dap
  - packages/dart

dev_dependencies:
  crypto: ^3.0.0
  json_schema: ^5.2.2
  melos: 7.0.0-dev.8
  yaml: ^3.1.3

melos:
  scripts:
    analyze:
      run: dart analyze .
      description: Analyze the workspace
    test:
      description: Test every package
      run: dart run tool/run_workspace_tests.dart
    format:
      run: dart run tool/check_format.dart
      description: Check Dart formatting without modifying files
