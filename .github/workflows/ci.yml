name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Dart workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve workspace
        run: dart pub get
      - name: Test workspace contract
        run: dart run tool/test/workspace_contract_test.dart
      - name: Verify workspace contract
        run: dart run tool/check_workspace.dart
      - name: Check formatting
        run: dart run melos format
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test
